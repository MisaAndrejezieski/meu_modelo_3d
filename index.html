<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gerador 3D para Impressão</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #1a1a1a;
        color: #fff;
      }
      #canvas-container {
        width: 100vw;
        height: 100vh;
      }
      #ui-container {
        position: absolute;
        top: 20px;
        left: 20px;
        background: rgba(30, 30, 30, 0.9);
        backdrop-filter: blur(10px);
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        border: 1px solid rgba(255, 255, 255, 0.1);
        width: 280px;
        display: flex;
        flex-direction: column;
        gap: 15px;
        z-index: 1000;
      }
      h2 {
        margin: 0;
        font-size: 1.1rem;
        color: #4facfe;
      }
      .control-group {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      label {
        font-size: 0.85rem;
        color: #ccc;
      }
      input[type="file"] {
        display: none;
      }
      .btn {
        background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
        color: #000;
        border: none;
        padding: 10px 15px;
        border-radius: 6px;
        font-weight: bold;
        cursor: pointer;
        text-align: center;
        transition: transform 0.1s ease;
      }
      .btn:hover {
        transform: scale(1.02);
      }
      .btn-export {
        background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
      }
      input[type="range"] {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div id="canvas-container"></div>

    <div id="ui-container">
      <h2>Criador 3D (Impressão)</h2>
      
      <label for="image-input" class="btn">📂 Carregar Imagem 2D</label>
      <input type="file" id="image-input" accept="image/*" />

      <div class="control-group">
        <label for="height-slider">Altura do Relevo (mm): <span id="height-val">5</span></label>
        <input type="range" id="height-slider" min="1" max="30" value="5" step="0.5" />
      </div>

      <div class="control-group">
        <label for="base-slider">Espessura da Base (mm): <span id="base-val">2</span></label>
        <input type="range" id="base-slider" min="0.5" max="10" value="2" step="0.5" />
      </div>

      <button id="export-btn" class="btn btn-export">💾 Exportar .STL (Impressão)</button>
    </div>

    <script type="module">
      import * as THREE from 'three';
      import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
      import { STLExporter } from 'three/examples/jsm/exporters/STLExporter.js';

      // --- CENA THREE.JS ---
      const container = document.getElementById('canvas-container');
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x18181c);

      const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, -90, 90);

      const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      // --- ILUMINAÇÃO ---
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
      dirLight.position.set(50, 50, 100);
      scene.add(dirLight);

      const dirLight2 = new THREE.DirectionalLight(0x4facfe, 1.2);
      dirLight2.position.set(-50, -50, 50);
      scene.add(dirLight2);

      // Grid (Plano de Impressão)
      const gridHelper = new THREE.GridHelper(150, 30, 0x4facfe, 0x444444);
      gridHelper.rotation.x = Math.PI / 2;
      scene.add(gridHelper);

      // --- ESTADO GLOBAL ---
      let currentMesh = null;
      let loadedImgElement = null;

      // Controls UI
      const heightSlider = document.getElementById('height-slider');
      const baseSlider = document.getElementById('base-slider');
      const heightVal = document.getElementById('height-val');
      const baseVal = document.getElementById('base-val');

      // --- GERADOR DE GEOMETRIA ---
      function generate3DMesh() {
        if (!loadedImgElement) return;

        if (currentMesh) {
          scene.remove(currentMesh);
          currentMesh.geometry.dispose();
          currentMesh.material.dispose();
          currentMesh = null;
        }

        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');

        const widthSegments = 120;
        const heightSegments = Math.round((loadedImgElement.height / loadedImgElement.width) * 120);

        canvas.width = widthSegments + 1;
        canvas.height = heightSegments + 1;

        ctx.drawImage(loadedImgElement, 0, 0, canvas.width, canvas.height);
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;

        const width3D = 100;
        const height3D = (loadedImgElement.height / loadedImgElement.width) * width3D;

        const geometry = new THREE.PlaneGeometry(width3D, height3D, widthSegments, heightSegments);
        const pos = geometry.attributes.position;

        const maxRelief = parseFloat(heightSlider.value);
        const baseThickness = parseFloat(baseSlider.value);

        for (let i = 0; i < pos.count; i++) {
          const r = imgData[i * 4];
          const g = imgData[i * 4 + 1];
          const b = imgData[i * 4 + 2];
          
          const brightness = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
          const z = (1 - brightness) * maxRelief + baseThickness;
          pos.setZ(i, z);
        }

        geometry.computeVertexNormals();

        const material = new THREE.MeshStandardMaterial({
          color: 0xdddddd,
          roughness: 0.3,
          metalness: 0.1,
          side: THREE.DoubleSide
        });

        currentMesh = new THREE.Mesh(geometry, material);
        scene.add(currentMesh);
      }

      // --- EVENTOS ---
      document.getElementById('image-input').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const url = URL.createObjectURL(file);
        const img = new Image();
        
        img.onload = () => {
          loadedImgElement = img;
          generate3DMesh();
          URL.revokeObjectURL(url);
        };

        img.src = url;
      });

      heightSlider.addEventListener('input', (e) => {
        heightVal.textContent = e.target.value;
        generate3DMesh();
      });

      baseSlider.addEventListener('input', (e) => {
        baseVal.textContent = e.target.value;
        generate3DMesh();
      });

      // EXPORTAR STL
      document.getElementById('export-btn').addEventListener('click', () => {
        if (!currentMesh) {
          alert('Por favor, carregue uma imagem primeiro!');
          return;
        }

        const exporter = new STLExporter();
        const result = exporter.parse(currentMesh, { binary: true });
        
        const blob = new Blob([result], { type: 'application/octet-stream' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'modelo_3d_impressao.stl';
        link.click();
      });

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }
      animate();
    </script>
  </body>
</html>
