<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Lithophane & G-Code Generator | WebGL Tool</title>
    
    <!-- Meta tags para SEO e Portfólio -->
    <meta name="description" content="Ferramenta WebGL para conversão de imagens 2D em modelos 3D (Lithophanes) e fatiamento direto para G-Code para impressão 3D." />
    <meta name="author" content="Seu Nome" />

    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- Viewport do Three.js -->
    <div id="canvas-container"></div>

    <!-- Interface de Usuário -->
    <main id="ui-container">
      <header class="header-title">
        <h1>Lithophane Generator</h1>
        <p class="subtitle">2D Image to 3D Mesh & G-Code Slicer</p>
      </header>

      <!-- Seletor de Arquivo -->
      <label for="image-input" class="btn">
        � Selecionar Imagem ou SVG
      </label>
      <input type="file" id="image-input" accept="image/*,.svg" />

      <div class="control-group">
        <label for="tool-type">Ferramenta:</label>
        <select id="tool-type">
          <option value="router">Router CNC</option>
          <option value="laser">Laser</option>
        </select>
      </div>

      <div class="control-group">
        <label for="width-input">Largura da peça (mm):</label>
        <input type="number" id="width-input" value="120" min="20" max="450" step="5" />
      </div>

      <div class="control-group raster-only">
        <label for="height-slider">
          Altura do relevo: <span id="height-val" class="val-indicator">5.0 mm</span>
        </label>
        <input type="range" id="height-slider" min="0.5" max="18" value="5.0" step="0.5" />
      </div>

      <div class="control-group raster-only">
        <label for="resolution-input">Resolução de preview:</label>
        <input type="range" id="resolution-input" min="32" max="256" value="128" step="8" />
      </div>

      <div class="control-group vector-only hidden">
        <label for="depth-input">Profundidade de corte (mm):</label>
        <input type="number" id="depth-input" value="3" min="0.2" max="12" step="0.2" />
      </div>

      <div class="control-group vector-only hidden">
        <label for="spindle-input">Velocidade spindle / laser (S):</label>
        <input type="number" id="spindle-input" value="1200" min="200" max="5000" step="50" />
      </div>

      <div class="control-group">
        <label for="feedrate-input">Velocidade de avanço (mm/min):</label>
        <input type="number" id="feedrate-input" value="1800" min="600" max="6000" step="100" />
      </div>

      <button id="export-gcode-btn" class="btn btn-gcode">
        ⚡ Gerar G-Code Profissional
      </button>

      <div id="status-panel" class="status-panel">
        <strong>Status:</strong>
        <div id="status-details">Nenhum arquivo carregado.</div>
      </div>

      <div class="footer-info">
        Projeto profissional para CNC Router e Laser com geração de G-Code em tempo real.
      </div>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
